<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <style>
    /* Buat skrin penuh & telus (invisible) */
    html, body {
      margin: 0;
      padding: 0;
      width: 100vw;
      height: 100vh;
      background: transparent !important;
      overflow: hidden;
      cursor: pointer;
    }
    #tap-zone {
      width: 100%;
      height: 100%;
      background: transparent;
    }
  </style>
</head>
<body>

  <audio id="bgm" loop preload="auto" playsinline>
    <source src="music.mp3" type="audio/mpeg">
  </audio>

  <div id="tap-zone"></div>

  <script>
    const audio = document.getElementById('bgm');

    // 1. Cuba paksa autoplay terus (kalau browser lepaskan)
    function forceAutoplay() {
      audio.play().then(() => {
        console.log("Autoplay success");
      }).catch(() => {
        console.log("Waiting for user tap");
      });
    }

    // 2. Sebaik sahaja ada sebarang touch/scroll/click, terus on lagu
    function playOnFirstInteract() {
      audio.play();
      // Remove listeners bila dah main
      ['click', 'touchstart', 'touchend', 'scroll', 'mousemove'].forEach(event => {
        window.removeEventListener(event, playOnFirstInteract);
        document.removeEventListener(event, playOnFirstInteract);
      });
    }

    window.addEventListener('load', forceAutoplay);
    
    ['click', 'touchstart', 'touchend', 'scroll', 'mousemove'].forEach(event => {
      window.addEventListener(event, playOnFirstInteract, { passive: true });
      document.addEventListener(event, playOnFirstInteract, { passive: true });
    });
  </script>
</body>
</html>
