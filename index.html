<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Wedding Music Player</title>

  <!-- Meta Tags Wajib untuk Canva Embed -->
  <meta property="og:title" content="Wedding Music Player">
  <meta property="og:description" content="Music Player">
  <meta property="og:type" content="website">
  <meta property="og:url" content="https://iam-flyin.github.io/Music-player/">

  <style>
    html, body {
      margin: 0;
      padding: 0;
      width: 100vw;
      height: 100vh;
      background: transparent !important;
      overflow: hidden;
    }
    #tap-zone {
      width: 100%;
      height: 100%;
      background: transparent;
      cursor: pointer;
    }
  </style>
</head>
<body>

  <audio id="bgm" loop preload="auto" playsinline>
    <source src="music.mp3" type="audio/mpeg">
  </audio>

  <div id="tap-zone"></div>

  <script>
    const audio = document.getElementById('bgm');

    function startPlay() {
      audio.play().catch(e => console.log(e));
      ['click', 'touchstart', 'scroll'].forEach(evt => {
        window.removeEventListener(evt, startPlay);
        document.removeEventListener(evt, startPlay);
      });
    }

    window.addEventListener('load', startPlay);
    ['click', 'touchstart', 'scroll'].forEach(evt => {
      window.addEventListener(evt, startPlay, { passive: true });
      document.addEventListener(evt, startPlay, { passive: true });
    });
  </script>
</body>
</html>
