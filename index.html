<!DOCTYPE html>
<html lang="ms">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }
    body {
      background: transparent;
      display: flex;
      justify-content: center;
      align-items: center;
      height: 100vh;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
    }
    /* Button custom yang aesthetic & fit dalam Canva */
    .music-btn {
      display: flex;
      align-items: center;
      gap: 8px;
      padding: 10px 18px;
      background: rgba(255, 255, 255, 0.9);
      border: 1px solid rgba(0, 0, 0, 0.1);
      border-radius: 50px;
      box-shadow: 0 4px 15px rgba(0,0,0,0.1);
      cursor: pointer;
      font-size: 14px;
      font-weight: 500;
      color: #333;
      transition: all 0.2s ease;
      user-select: none;
    }
    .music-btn:active {
      transform: scale(0.96);
    }
    .icon {
      font-size: 16px;
    }
  </style>
</head>
<body>

  <audio id="bgm" loop preload="auto" playsinline>
    <source src="music.mp3" type="audio/mpeg">
  </audio>

  <!-- Button Play/Mute yang boleh klik kat Canva -->
  <div class="music-btn" id="toggleBtn" onclick="toggleAudio()">
    <span class="icon" id="btnIcon">🎵</span>
    <span id="btnText">Play Music</span>
  </div>

  <script>
    const audio = document.getElementById('bgm');
    const btnIcon = document.getElementById('btnIcon');
    const btnText = document.getElementById('btnText');
    let isPlaying = false;

    // 1. Cuba paksa autoplay (kalau browser izin)
    window.addEventListener('DOMContentLoaded', () => {
      const playPromise = audio.play();
      if (playPromise !== undefined) {
        playPromise.then(() => {
          isPlaying = true;
          updateUI();
        }).catch(() => {
          // Autoplay kena block oleh browser, tunggu first touch/click
          console.log("Autoplay blocked, waiting for user interaction");
        });
      }
    });

    // 2. Auto-play pada first touch/click kat iframe
    const startAudio = () => {
      if (!isPlaying) {
        audio.play().then(() => {
          isPlaying = true;
          updateUI();
        }).catch(e => console.log(e));
      }
      document.removeEventListener('click', startAudio);
      document.removeEventListener('touchstart', startAudio);
      document.removeEventListener('scroll', startAudio);
    };

    document.addEventListener('click', startAudio);
    document.addEventListener('touchstart', startAudio);
    document.addEventListener('scroll', startAudio);

    // 3. Manual toggle bila user tekan button
    function toggleAudio() {
      if (audio.paused) {
        audio.play();
        isPlaying = true;
      } else {
        audio.pause();
        isPlaying = false;
      }
      updateUI();
    }

    function updateUI() {
      if (!audio.paused) {
        btnIcon.textContent = '🔊';
        btnText.textContent = 'Pause Music';
      } else {
        btnIcon.textContent = '🔈';
        btnText.textContent = 'Play Music';
      }
    }
  </script>
</body>
</html>
