<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <style>
    body {
      margin: 0;
      padding: 0;
      background: transparent;
      display: flex;
      justify-content: center;
      align-items: center;
      height: 100vh;
    }
    audio {
      width: 100%;
    }
  </style>
</head>
<body>

  <audio id="bgm" controls loop playsinline preload="auto">
    <source src="music.mp3" type="audio/mpeg">
    Your browser does not support audio.
  </audio>

  <script>
    const audio = document.getElementById('bgm');

    // Cuba play terus
    audio.play().catch(() => {
      // Kalau browser block, tunggu user tap mana-mana bahagian skrin
      const playOnTap = () => {
        audio.play();
        document.removeEventListener('touchstart', playOnTap);
        document.removeEventListener('click', playOnTap);
      };
      document.addEventListener('touchstart', playOnTap);
      document.addEventListener('click', playOnTap);
    });
  </script>
</body>
</html>
